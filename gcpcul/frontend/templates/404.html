{% extends "base.html" %} 
{% load static %}

{% block content %}
<style>
    .not-found-wrapper {
        min-height: 70vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 3rem 1rem;
        background-color: #f8f9fa;
        font-family: inherit;
    }
    .not-found-icon {
        margin-bottom: -1rem;
        animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
    }
    .not-found-code {
        font-size: clamp(6rem, 15vw, 10rem);
        font-weight: 900;
        color: #0d3b2a; 
        line-height: 1;
        margin: 0;
        letter-spacing: -2px;
    }
    .not-found-title {
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 700;
        color: #2d3748;
        margin: 1rem 0;
    }
    .not-found-message {
        font-size: 1.125rem;
        color: #4a5568;
        max-width: 500px;
        margin-bottom: 2.5rem;
        line-height: 1.6;
    }
    .not-found-btn {
        display: inline-block;
        background-color: #f0b429; 
        color: #0d3b2a;
        font-weight: 700;
        padding: 1rem 2.5rem;
        border-radius: 50px;
        text-decoration: none;
        transition: all 0.2s ease-in-out;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .not-found-btn:hover {
        background-color: #d9a224;
        transform: translateY(-2px);
        box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
    }
</style>

<div class="not-found-wrapper">
    <!-- SVG Search/Error Icon -->
    <div class="not-found-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#f0b429" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <line x1="9" y1="9" x2="13" y2="13" stroke="#0d3b2a"></line>
            <line x1="13" y1="9" x2="9" y2="13" stroke="#0d3b2a"></line>
        </svg>
    </div>
    
    <h1 class="not-found-code">404</h1>
    <h2 class="not-found-title">We couldn't find that page.</h2>
    <p class="not-found-message">
        The page you are looking for may have been moved, renamed, or deleted during our recent system upgrade. 
    </p>
    <a href="{% url 'home' %}" class="not-found-btn">Return to Homepage</a>
</div>
{% endblock %}
